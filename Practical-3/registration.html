<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#eef7ff;
    font-family:Arial,sans-serif;
}

header{
    background:#198754;
    color:white;
    text-align:center;
    padding:20px;
}

main{
    width:450px;
    margin:40px auto;
}

form{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:25px;
    padding:12px;
    background:#198754;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#146c43;
}

footer{
    text-align:center;
    margin-top:20px;
}
    </style>
</head>
<body>

<header>
    <h1>Create Account</h1>
</header>

<main>
    <form>
        <label for="name">Name</label><br>
        <input type="text" id="name"><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email"><br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password"><br><br>

        <button type="submit">Register</button>
    </form>
</main>

</body>
</html>
