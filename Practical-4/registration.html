<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#eef7ff;font-family:Arial,sans-serif;transition:0.3s;}
header{background:#198754;color:white;text-align:center;padding:20px;position:relative;}
nav{margin-top:15px;}
nav a{display:inline-block;background:white;color:#198754;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:bold;}
nav a:hover{background:#146c43;color:white;}
main{width:450px;max-width:90%;margin:40px auto;}
form{background:white;padding:30px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.2);transition:0.3s;}
label{display:block;margin-top:15px;font-weight:bold;}
input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:6px;}
button[type="submit"]{width:100%;margin-top:25px;padding:12px;background:#198754;color:white;border:none;border-radius:6px;cursor:pointer;}
button[type="submit"]:hover{background:#146c43;}
footer{text-align:center;margin-top:20px;}

.ui-btn {position: absolute; top: 20px; background: white; color: #198754; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}
#themeToggle {right: 20px;}
#menuToggle {right: 110px; display: none;}
.dark-mode {background: #121212; color: #eee;}
.dark-mode form {background: #1e1e1e;}
.dark-mode input {background: #333; color: white; border: 1px solid #555;}
.dark-mode header {background: #111;}
@media (max-width: 600px) {
    #menuToggle {display: block;}
    nav {display: none; flex-direction: column; gap: 10px;}
    nav.active {display: flex;}
}
    </style>
</head>
<body>
<header>
    <button id="menuToggle" class="ui-btn">☰ Menu</button>
    <button id="themeToggle" class="ui-btn">🌙 Theme</button>
    <h1>Create Account</h1>
    <nav id="navMenu">
        <a href="index.html">Home Page</a>
        <p></p>
    </nav>
</header>
<main>
    <form>
        <label for="name">Name</label><br>
        <input type="text" id="name"><br><br>
        <label for="email">Email</label><br>
        <input type="email" id="email"><br><br>
        <label for="password">Password</label><br>
        <input type="password" id="password"><br><br>
        <button type="submit">Register</button>
    </form>
</main>
<script>
    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navMenu').classList.toggle('active'));
    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
</script>
</body>
</html>
