<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events - StudentHub</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff8ef;font-family:Arial,sans-serif;transition:0.3s;}
header{background:#ff9800;color:white;padding:20px;text-align:center;position:relative;}
nav{margin-top:15px;}
nav a{display:inline-block;background:white;color:#ff9800;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:bold;}
nav a:hover{background:#e65100;color:white;}
section{width:80%;margin:30px auto;background:white;padding:25px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.2);transition:0.3s;}
h2{margin-bottom:20px;color:#ff9800;}
ul{margin-left:0; list-style: none;}
li{padding:15px;margin-bottom:10px;background:#fff3e0;border-radius:5px;display:flex;justify-content:space-between;align-items:center;}

.ui-btn {position: absolute; top: 20px; background: white; color: #ff9800; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}
#themeToggle {right: 20px;}
#menuToggle {right: 110px; display: none;}
.dark-mode {background: #121212; color: #eee;}
.dark-mode section {background: #1e1e1e;}
.dark-mode header {background: #222;}
.dark-mode li {background: #333; color: white;}

.modal-btn {background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight:bold;}
.modal-btn:hover {background: #e65100;}
.modal {display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6);}
.modal-content {background-color: #fff; margin: 15% auto; padding: 25px; border-radius: 8px; width: 350px; position: relative;}
.dark-mode .modal-content {background-color: #222;}
.close-modal {position: absolute; right: 15px; top: 10px; font-size: 24px; font-weight: bold; cursor: pointer;}

.controls-container {display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
.controls-container input, .controls-container select {padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex: 1; min-width: 150px;}
.dark-mode .controls-container input, .dark-mode .controls-container select {background: #333; color: white; border-color: #555;}
.event-details span {display: block; font-size: 14px; color: #666; margin-top: 5px;}
.dark-mode .event-details span {color: #aaa;}
.pagination {display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px;}
.pagination button {background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight:bold;}
.pagination button:disabled {background: #ccc; cursor: not-allowed;}

@media (max-width: 600px) {
    #menuToggle {display: block;}
    nav {display: none; flex-direction: column; gap: 10px;}
    nav.active {display: flex;}
    li {flex-direction: column; align-items: flex-start; gap: 10px;}
}
    </style>
</head>
<body>

<header>
    <button id="menuToggle" class="ui-btn">☰ Menu</button>
    <button id="themeToggle" class="ui-btn">🌙 Theme</button>
    <h1>Upcoming Events</h1>
    <nav id="navMenu">
        <a href="index.html">Home Page</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>
    <section>
        <h2>Event Directory</h2>
        
        <div class="controls-container">
            <input type="text" id="searchInput" placeholder="Search by event title...">
            
            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Workshop">Workshop</option>
                <option value="Competition">Competition</option>
                <option value="Seminar">Seminar</option>
                <option value="Sports">Sports</option>
                <option value="Exhibition">Exhibition</option>
            </select>

            <select id="sortOption">
                <option value="dateAsc">Date (Soonest First)</option>
                <option value="dateDesc">Date (Latest First)</option>
                <option value="titleAsc">Title (A-Z)</option>
            </select>
        </div>

        <ul id="eventList">
            <li>Loading events...</li>
        </ul>

        <div class="pagination">
            <button id="prevPage" disabled>Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPage" disabled>Next</button>
        </div>
    </section>
</main>

<div id="eventModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <h2 style="margin-top:0; color:#ff9800;">Event Information</h2>
        <p id="modalText"></p>
    </div>
</div>

<script>
    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navMenu').classList.toggle('active'));
    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));

    const modal = document.getElementById("eventModal");
    const modalText = document.getElementById("modalText");
    
    document.getElementById('eventList').addEventListener('click', function(e) {
        if (e.target.classList.contains('modal-btn')) {
            modalText.textContent = e.target.getAttribute('data-info');
            modal.style.display = "block";
        }
    });

    document.getElementById('closeModal').addEventListener('click', () => modal.style.display = "none");
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = "none"; });

    let allEvents = [];
    let filteredEvents = [];
    let currentPage = 1;
    const itemsPerPage = 4;

    fetch('events.json')
        .then(response => {
            if (!response.ok) throw new Error("Could not fetch events.json");
            return response.json();
        })
        .then(data => {
            allEvents = data;
            processEvents(); // Run initial render
        })
        .catch(error => {
            document.getElementById('eventList').innerHTML = `<li>Error: Ensure you are running this on a local server to use Fetch API. (${error.message})</li>`;
        });

    function processEvents() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const category = document.getElementById('categoryFilter').value;
        const sortType = document.getElementById('sortOption').value;

        filteredEvents = allEvents.filter(event => {
            const matchesSearch = event.title.toLowerCase().includes(searchTerm);
            const matchesCategory = category === "All" || event.category === category;
            return matchesSearch && matchesCategory;
        });

        filteredEvents.sort((a, b) => {
            if (sortType === "dateAsc") return new Date(a.date) - new Date(b.date);
            if (sortType === "dateDesc") return new Date(b.date) - new Date(a.date);
            if (sortType === "titleAsc") return a.title.localeCompare(b.title);
        });
        currentPage = 1; 
        renderPaginatedEvents();
    }
    function renderPaginatedEvents() {
        const listContainer = document.getElementById('eventList');
        listContainer.innerHTML = ''; // Clear current list

        if (filteredEvents.length === 0) {
            listContainer.innerHTML = '<li>No events found matching your criteria.</li>';
            updatePaginationControls(0);
            return;
        }

        const totalPages = Math.ceil(filteredEvents.length / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
                const paginatedItems = filteredEvents.slice(startIndex, endIndex);

        paginatedItems.forEach(event => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="event-details">
                    <strong>${event.title}</strong>
                    <span>📅 ${event.date} | 🏷️ ${event.category}</span>
                </div>
                <button class="modal-btn" data-info="${event.desc}">View Details</button>
            `;
            listContainer.appendChild(li);
        });

        updatePaginationControls(totalPages);
    }
    function updatePaginationControls(totalPages) {
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const pageInfo = document.getElementById('pageInfo');

        if (totalPages === 0) {
            pageInfo.textContent = `Page 0 of 0`;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }

        pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
    }
    document.getElementById('searchInput').addEventListener('input', processEvents);
    document.getElementById('categoryFilter').addEventListener('change', processEvents);
    document.getElementById('sortOption').addEventListener('change', processEvents);

    document.getElementById('nextPage').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredEvents.length / itemsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderPaginatedEvents();
        }
    });

    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            renderPaginatedEvents();
        }
    });
</script>
</body>
</html>
