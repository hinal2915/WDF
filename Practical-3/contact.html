<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <style>
        *{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef6ff;
font-family:Arial,sans-serif;
}

header{
background:#673ab7;
color:white;
padding:20px;
text-align:center;
}

form{
width:400px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,.2);
}

textarea{
width:100%;
height:120px;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

button{
background:#673ab7;
color:white;
border:none;
padding:12px 25px;
margin-top:15px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#512da8;
}
    </style>
</head>
<body>

<header>
    <h1>Contact Us</h1>
</header>

<main>
    <form>
        <label for="message">Message</label><br>
        <textarea id="message"></textarea><br><br>

        <button type="submit">Send</button>
    </form>
</main>

</body>
</html>
