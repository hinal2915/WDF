<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AJAX CRUD without Reload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #0d6efd; color: white; border: none; cursor: pointer; }
        button.danger { background: #dc3545; }
        button.warning { background: #ffc107; color: black; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        #messageBox { padding: 10px; margin-bottom: 10px; display: none; border-radius: 4px; }
        .success { background: #d1e7dd; color: #0f5132; }
        .error { background: #f8d7da; color: #842029; }
        .loading { background: #fff3cd; color: #664d03; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Management (AJAX/Fetch API)</h2>
        
        <div id="messageBox"></div>

        <div style="border: 1px solid #ccc; padding: 15px; border-radius: 5px;">
            <input type="hidden" id="studentId">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="email" id="email" placeholder="Student Email" required>
            <input type="text" id="course" placeholder="Course" required>
            <button id="saveBtn" onclick="saveStudent()">Save Student</button>
        </div>

        <table>
            <thead>
                <tr style="background: #f8f9fa;">
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Data will be populated here via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchStudents() {
            showMessage("Loading data...", "loading");
            try {
                const response = await fetch('api.php');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const tbody = document.getElementById('studentTableBody');
                    tbody.innerHTML = ''; 
                    
                    result.data.forEach(student => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${student.id}</td>
                                <td>${student.name}</td>
                                <td>${student.email}</td>
                                <td>${student.course}</td>
                                <td>
                                    <button class="warning" onclick="editStudent(${student.id}, '${student.name}', '${student.email}', '${student.course}')">Edit</button>
                                    <button class="danger" onclick="deleteStudent(${student.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                    hideMessage();
                }
            } catch (error) {
                showMessage("Failed to load students.", "error");
            }
        }

        async function saveStudent() {
            const id = document.getElementById('studentId').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const course = document.getElementById('course').value;

            if (!name || !email || !course) {
                showMessage("All fields are required!", "error");
                return;
            }

            showMessage("Saving...", "loading");
            
            const method = id ? 'PUT' : 'POST';
            const payload = { id, name, email, course };

            try {
                const response = await fetch('api.php', {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    showMessage(result.message, "success");
                    clearForm();
                    fetchStudents(); // Refresh table without reloading page
                } else {
                    showMessage(result.message, "error");
                }
            } catch (error) {
                showMessage("An error occurred while saving.", "error");
            }
        }

        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) return;

            showMessage("Deleting...", "loading");
            try {
                const response = await fetch('api.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    showMessage(result.message, "success");
                    fetchStudents();
                } else {
                    showMessage(result.message, "error");
                }
            } catch (error) {
                showMessage("An error occurred while deleting.", "error");
            }
        }

        function editStudent(id, name, email, course) {
            document.getElementById('studentId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('email').value = email;
            document.getElementById('course').value = course;
            document.getElementById('saveBtn').innerText = "Update Student";
            window.scrollTo(0, 0);
        }

        function clearForm() {
            document.getElementById('studentId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('course').value = '';
            document.getElementById('saveBtn').innerText = "Save Student";
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.className = type;
            msgBox.style.display = 'block';
            if (type === 'success') setTimeout(hideMessage, 3000);
        }

        function hideMessage() {
            document.getElementById('messageBox').style.display = 'none';
        }
        fetchStudents();
    </script>
</body>
</html>
