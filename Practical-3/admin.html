<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
       *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f8fc;
    font-family:Arial, sans-serif;
    color:#333;
}

header{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:20px;
}

main{
    width:80%;
    margin:30px auto;
}

section{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

h1,h2{
    margin-bottom:15px;
}

ul{
    margin-left:20px;
}

li{
    margin:10px 0;
    padding:8px;
    background:#e3f2fd;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table,th,td{
    border:1px solid #ccc;
}

th{
    background:#0077b6;
    color:white;
}

th,td{
    padding:10px;
    text-align:center;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#0077b6;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005f8f;
}

footer{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
    </style>
</head>
<body>

<header>
    <h1>Admin Dashboard</h1>
</header>

<main>
    <section>
        <ul>
            <li>Manage Students</li>
            <li>Manage Events</li>
            <li>View Reports</li>
        </ul>
    </section>
</main>

</body>
</html>
