<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure User Registration</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Secure Registration</h2>
    <div id="jsError" class="error"></div>
    
    <form id="secureRegForm" action="process_registration.php" method="POST" onsubmit="return validateForm()">
        <label>Username:</label>
        <input type="text" id="username" name="username" required minlength="4">
        
        <label>Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label>Password:</label>
        <input type="password" id="password" name="password" required minlength="8">
        
        <button type="submit">Register securely</button>
    </form>
</div>

<script>
function validateForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('jsError');
    
    if (username.length < 4) {
        errorDiv.textContent = "Username must be at least 4 characters.";
        errorDiv.style.display = "block";
        return false;
    }
    
    if (password.length < 8) {
        errorDiv.textContent = "Password must be at least 8 characters.";
        errorDiv.style.display = "block";
        return false;
    }
    
    return true; // Form is valid, submit to PHP
}
</script>

</body>
</html>
