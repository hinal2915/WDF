<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
       *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#2196f3,#64b5f6);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

form{
    background:white;
    padding:35px;
    width:350px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#0d47a1;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}
    </style>
</head>
<body>

<header>
    
</header>

<main>
    <form>
        <label for="email">Email</label><br>
        <input type="email" id="email"><br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password"><br><br>

        <button type="submit">Login</button>
    </form>
</main>

</body>
</html>
