<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f4f8fc;font-family:Arial, sans-serif;color:#333;transition:0.3s;}
header{background:#0077b6;color:white;text-align:center;padding:20px;position:relative;}
nav{margin-top:15px;}
nav a{display:inline-block;background:white;color:#0077b6;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:bold;}
nav a:hover{background:#005f8f;color:white;}
main{width:80%;margin:30px auto;}
section{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:0.3s;}
h1,h2{margin-bottom:15px;}
ul{margin-left:20px;}
li{margin:10px 0;padding:8px;background:#e3f2fd;border-radius:5px;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
table,th,td{border:1px solid #ccc;}
th{background:#0077b6;color:white;}
th,td{padding:10px;text-align:center;}
input,textarea,select{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px;}
button{background:#0077b6;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;}
button:hover{background:#005f8f;}
footer{background:#0077b6;color:white;text-align:center;padding:15px;margin-top:20px;}

.ui-btn {position: absolute; top: 20px; background: white; color: #0077b6; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}
#themeToggle {right: 20px;}
#menuToggle {right: 110px; display: none;}
.dark-mode {background: #121212; color: #eee;}
.dark-mode section {background: #1e1e1e;}
.dark-mode header, .dark-mode footer {background: #111;}
.dark-mode li {background: #333; color: white;}
@media (max-width: 600px) {
    #menuToggle {display: block;}
    nav {display: none; flex-direction: column; gap: 10px;}
    nav.active {display: flex;}
}
    </style>
</head>
<body>
<header>
    <button id="menuToggle" class="ui-btn">☰ Menu</button>
    <button id="themeToggle" class="ui-btn">🌙 Theme</button>
    <h1>Admin Dashboard</h1>
    <nav id="navMenu">
        <a href="index.html">Home Page</a>
        <p></p>
    </nav>
</header>
<main>
    <section>
        <ul>
            <li>Manage Students</li>
            <li>Manage Events</li>
            <li>View Reports</li>
        </ul>
    </section>
</main>
<script>
    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navMenu').classList.toggle('active'));
    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
</script>
</body>
</html>
