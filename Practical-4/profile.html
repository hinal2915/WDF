<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#eefaf7;font-family:Arial,sans-serif;transition:0.3s;}
header{background:#009688;color:white;text-align:center;padding:20px;position:relative;}
nav{margin-top:15px;}
nav a{display:inline-block;background:white;color:#009688;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:bold;}
nav a:hover{background:#00695c;color:white;}
section{width:450px;max-width:90%;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 12px rgba(0,0,0,.2);transition:0.3s;}
p{padding:10px;border-bottom:1px solid #ddd;}
strong{color:#009688;}

.ui-btn {position: absolute; top: 20px; background: white; color: #009688; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}
#themeToggle {right: 20px;}
#menuToggle {right: 110px; display: none;}
.dark-mode {background: #121212; color: #eee;}
.dark-mode section {background: #1e1e1e;}
.dark-mode p {border-bottom: 1px solid #444;}
.dark-mode header {background: #111;}
@media (max-width: 600px) {
    #menuToggle {display: block;}
    nav {display: none; flex-direction: column; gap: 10px;}
    nav.active {display: flex;}
}
    </style>
</head>
<body>
<header>
    <button id="menuToggle" class="ui-btn">☰ Menu</button>
    <button id="themeToggle" class="ui-btn">🌙 Theme</button>
    <h1>Student Profile</h1>
    <nav id="navMenu">
        <a href="index.html">Home Page</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>
<main>
    <section>
        <p><strong>Name:</strong>Chaklie</p>
        <p><strong>Email:</strong>xyz@gmail.com</p>
        <p><strong>Course:</strong> B.tech</p>
        <p><strong>Department:</strong>Computer Engineering</p>
        <p><strong>Semester:</strong>3</p>
        <p><strong>Counsellor Name:</strong>Khushi Ma'am</p>
    </section>
</main>
<script>
    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navMenu').classList.toggle('active'));
    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
</script>
</body>
</html>
