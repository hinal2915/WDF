<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <style>

*{margin:0;padding:0;box-sizing:border-box;}
body{background:#eef6ff;font-family:Arial,sans-serif;transition:0.3s;}
header{background:#673ab7;color:white;padding:20px;text-align:center;position:relative;}
nav{margin-top:15px;}
nav a{display:inline-block;background:white;color:#673ab7;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:bold;}
nav a:hover{background:#512da8;color:white;}
form{width:400px;max-width:90%;margin:40px auto;background:white;padding:30px;border-radius:10px;box-shadow:0 5px 10px rgba(0,0,0,.2);transition:0.3s;}
textarea{width:100%;height:120px;padding:10px;border:1px solid #ccc;border-radius:6px;}
button[type="submit"]{background:#673ab7;color:white;border:none;padding:12px 25px;margin-top:15px;border-radius:6px;cursor:pointer;}
button[type="submit"]:hover{background:#512da8;}

.ui-btn {position: absolute; top: 20px; background: white; color: #673ab7; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}
#themeToggle {right: 20px;}
#menuToggle {right: 110px; display: none;}
.dark-mode {background: #121212; color: #eee;}
.dark-mode form {background: #1e1e1e;}
.dark-mode textarea {background: #333; color: white; border: 1px solid #555;}
.dark-mode header {background: #111;}
@media (max-width: 600px) {
    #menuToggle {display: block;}
    nav {display: none; flex-direction: column; gap: 10px;}
    nav.active {display: flex;}
}
    </style>
</head>
<body>
<header>
    <button id="menuToggle" class="ui-btn">☰ Menu</button>
    <button id="themeToggle" class="ui-btn">🌙 Theme</button>
    <h1>Contact Us</h1>
    <nav id="navMenu">
        <a href="index.html">Home Page</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>
<main>
    <form>
        <label for="message">Message</label><br>
        <textarea id="message"></textarea><br><br>
        <button type="submit">Send</button>
    </form>
</main>
<script>
    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navMenu').classList.toggle('active'));
    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
</script>
</body>
</html>
