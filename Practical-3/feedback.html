<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
    <style>
       *{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#fff5f7;
font-family:Arial,sans-serif;
}

header{
background:#e91e63;
color:white;
padding:20px;
text-align:center;
}

form{
width:420px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,.2);
}

textarea{
width:100%;
height:130px;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

button{
background:#e91e63;
color:white;
border:none;
padding:12px 25px;
margin-top:15px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#c2185b;
}

footer{
text-align:center;
padding:20px;
color:#444;
font-weight:bold;
}
    </style>
</head>
<body>

<header>
    <h1>Feedback</h1>
</header>

<main>
    <form>
        <label for="feedback">Your Feedback</label><br>
        <textarea id="feedback"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>
</main>

<footer>
    <p>Thank you for your feedback!</p>
</footer>

</body>
</html>
